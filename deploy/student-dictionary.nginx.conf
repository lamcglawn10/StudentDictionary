# Hour 5 — Student Dictionary reverse proxy for the existing Ubuntu EC2.
# HTTP is for a restricted-IP training check ONLY. Use HTTPS + auth before real data.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Built React files copied into /var/www in Hour 5.
    root /var/www/student-dictionary;
    index index.html;

    # IMPORTANT: proxy_pass has NO trailing slash, so Flask receives /api/v1/students.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # React single-page frontend (not an API route).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
